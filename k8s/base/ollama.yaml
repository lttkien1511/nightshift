apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: nightshift
  labels:
    app.kubernetes.io/name: nightshift
    app.kubernetes.io/component: ollama
  annotations:
    # Pulled models are slow to fetch again: never let Argo CD delete the volume.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: nightshift
  labels:
    app.kubernetes.io/name: nightshift
    app.kubernetes.io/component: ollama
  # No sync-wave on purpose, same reason as nightshift-web: the PVC and its consumer
  # must be applied together or the local-path volume never binds.
spec:
  replicas: 1
  strategy:
    type: Recreate # one RWO volume and one big model in RAM: never run two at once
  selector:
    matchLabels:
      app.kubernetes.io/name: nightshift
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nightshift
        app.kubernetes.io/component: ollama
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.35.0
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: HOME
              value: /home/ollama
            - name: OLLAMA_MODELS
              value: /models
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_KEEP_ALIVE
              value: 5m
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "6"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: models
              mountPath: /models
            - name: home
              mountPath: /home/ollama
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
        - name: home
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: nightshift
  labels:
    app.kubernetes.io/name: nightshift
    app.kubernetes.io/component: ollama
spec:
  selector:
    app.kubernetes.io/name: nightshift
    app.kubernetes.io/component: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
