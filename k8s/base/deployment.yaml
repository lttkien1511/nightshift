apiVersion: apps/v1
kind: Deployment
metadata:
  name: nightshift-web
  namespace: nightshift
  labels:
    app.kubernetes.io/name: nightshift
    app.kubernetes.io/component: web
  # No sync-wave on purpose: the local-path volume only binds once a pod uses it,
  # so the PVC and this Deployment must be applied in the same wave.
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nightshift
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nightshift
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/lttkien1511/nightshift
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NIGHTSHIFT_DATA_DIR
              value: /data
            - name: NIGHTSHIFT_MAX_BYTES
              value: "1000000"
            - name: NIGHTSHIFT_MAX_QUEUE
              value: "20"
            - name: NIGHTSHIFT_OLLAMA_URL
              value: http://ollama.nightshift.svc.cluster.local:11434
            # Models offered by the Run now button (the nightly CronJob has its own list).
            - name: NIGHTSHIFT_RUN_MODELS
              value: qwen2.5:7b
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nightshift-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
