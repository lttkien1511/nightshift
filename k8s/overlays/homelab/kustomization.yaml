apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/lttkien1511/nightshift
    newTag: sha-be2af41
patches:
  - target:
      kind: Ingress
      name: nightshift
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: nightshift.kienhomeserver.lab
      - op: replace
        path: /spec/tls/0/hosts/0
        value: nightshift.kienhomeserver.lab
