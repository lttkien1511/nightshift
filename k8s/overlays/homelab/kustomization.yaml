apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/lttkien1511/nightshift
    newTag: sha-49d27c7
patches:
  - target:
      kind: Ingress
      name: nightshift
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: nightshift.kienhomeserver.lab
      - op: replace
        path: /spec/tls/0/hosts/0
        value: nightshift.kienhomeserver.lab
  - target:
      kind: Deployment
      name: nightshift-web
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NIGHTSHIFT_MONITOR_URL
          value: https://monitor.kienhomeserver.lab
