apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nightshift
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lttkien1511/nightshift.git
    targetRevision: main
    path: k8s/overlays/homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: nightshift
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
